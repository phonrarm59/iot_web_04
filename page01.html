<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Itim&family=Monomaniac+One&display=swap" rel="stylesheet">
    <style>
        body{
            background-color: rgb(0, 0, 0);
        }
        a , i{
            color: white;
            font-size: 20px;
        }
        .nav-hello span{
            color: rgb(255, 100, 28);
            font-family: itim;
            font-size: 50px;
            font-style: italic;
        }
        .nav-menu a{
            font-family: monomaniac one;
            text-decoration: none;
        }
        .navbar{
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 30px 80px;
        }
        .nav-menu , .nav-hello , .nav-icons{
            width: 100%;
        }
        .nav-hello{
            text-align: center;
        }
        .nav-icons{
            display: flex;
            justify-content: flex-end;
            gap: 30px;
        }
        .nav-menu{
            display: flex;
            gap: 30px;
        }
        .per-info span{
            color: white;
            font-family: monomaniac one;
            font-size: 40px;

        }
        .per-info{
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 100px;
        }
        #mom{
            color: rgb(255, 100, 28);;
        }
        .per-pic{
            margin-top: 100px;
            display: flex;
            justify-content: center;
        }
        img{
            width: 300px;
            height: 300px;
            object-fit: cover;
            border-radius: 50%;
            border: 5px solid rgb(255, 100, 28);
            padding: 15px;
        }
        a:hover{
            color: rgb(255, 100, 28);
        }
        i:hover{
            color: rgb(255, 100, 28);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- navbar -->
         <div class="navbar">
            <div class="nav-menu">
                <a href="">Portfolio</a>
                <a href="">About me</a>
                <a href="">Get In Touch</a>
            </div>

            <div class="nav-hello">
                <span>Hello</span>
            </div>

            <div  class="nav-icons">
                <a href=""><i class="bi bi-github"></i></a> 
                <a href=""><i class="bi bi-linkedin"></i></a> 
                <a href=""><i class="bi bi-instagram"></i></a> 
                <a href=""><i class="bi bi-twitter"></i></a> 
            </div>




         </div>
         <!-- personnel -->
         <div class="personnel">

         </div>

         <!-- picture -->
         <div class="picture">

         </div>

    <div class="per-info">
        <span>6819M10021</span>
        <span>Tepamorn Koetthong</span>
        <span id="mom">Freelance Web Developer</span>
        <span>Based In Thailand</span>
    </div>
    
    <div class="per-pic">
        <img src="./images/person.jpg" alt="person">
    </div>

    </div>
</body>
</html>
